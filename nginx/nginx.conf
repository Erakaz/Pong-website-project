user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    # Ne pas divulguer la version de nginx dans les reponses et les pages
    # d'erreur : reconnaissance facilitee pour un attaquant.
    server_tokens   off;

    # Les avatars sont la seule chose que l'utilisateur televerse.
    client_max_body_size 2m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    upstream backend_app {
        server backend:8000;
        keepalive 32;
    }

    # -----------------------------------------------------------------------
    #  HTTP : uniquement la pour rediriger vers HTTPS.
    #  Le sujet impose une connexion HTTPS pour tous les aspects du site.
    # -----------------------------------------------------------------------
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        return 301 https://$host:8443$request_uri;
    }

    # -----------------------------------------------------------------------
    #  HTTPS : frontend statique + reverse proxy vers Django/Daphne.
    # -----------------------------------------------------------------------
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        root /srv/frontend;
        index index.html;
        charset utf-8;

        # -- En-tetes de securite -------------------------------------------
        # Declares au niveau `server` et jamais redeclares dans un `location` :
        # un `add_header` dans un bloc imbrique annulerait TOUS ceux herites.
        #
        # HSTS : force le navigateur a n'utiliser que HTTPS sur cet hote.
        # Attention en developpement local : cela s'applique a `localhost`
        # tous ports confondus. Pour l'annuler, voir la section « HSTS » du
        # README, ou commenter la ligne ci-dessous.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Pas de MIME sniffing : un .txt televerse ne sera jamais execute.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        # CSP stricte : aucune source externe, aucun script ni style inline.
        # C'est la contrainte qui rend toute injection XSS non exploitable,
        # meme si une echappement etait oublie quelque part.
        #   img-src data:  -> QR code de la 2FA rendu en data URI
        #   img-src blob:  -> previsualisation locale de l'avatar avant envoi
        #   connect-src 'self' -> couvre aussi wss:// vers la meme origine
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; media-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        # -- API REST --------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Indique a Django que la requete d'origine etait bien en HTTPS
            # (cf. SECURE_PROXY_SSL_HEADER dans settings.py).
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";
            proxy_read_timeout 30s;
        }

        # -- WebSocket (jeu, chat, presence) ---------------------------------
        # wss:// et non ws:// : impose par le sujet.
        location /ws/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Origin            $http_origin;
            # Une partie ou une conversation peut rester ouverte longtemps
            # sans trafic serveur -> pas de coupure prematuree.
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
            proxy_buffering     off;
        }

        # -- Avatars televerses ----------------------------------------------
        location /media/ {
            alias /srv/media/;
            expires 7d;
            # Aucun handler n'est monte ici : nginx sert les fichiers tels
            # quels, et nosniff (herite) empeche toute reinterpretation.
            try_files $uri =404;
        }

        # -- Assets du frontend ----------------------------------------------
        # Servis en =404 stricts : sans cela, un chemin de module JS errone
        # recevrait index.html en reponse, ce qui produit un warning de type
        # MIME en console — et le sujet exige zero warning.
        location ~ ^/(js|css|vendor|assets)/ {
            try_files $uri =404;
            expires 1h;
        }

        location = /favicon.ico {
            try_files $uri =404;
            expires 30d;
        }

        # -- Coquille de la SPA ----------------------------------------------
        # Toute autre URL renvoie index.html : c'est ce qui permet d'ouvrir
        # directement https://localhost:8443/profile ou d'utiliser les boutons
        # Precedent / Suivant du navigateur avec le routeur History API.
        location / {
            try_files $uri /index.html;
            expires -1;
        }
    }
}
